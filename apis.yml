aid: rho-protocol
name: Rho Protocol
description: >-
  Rho Protocol (Rho Labs) operates Rho X, a decentralized multi-asset trading and settlement
  layer for on-chain capital markets — interest-rate futures, perpetuals, and tokenized
  real-world assets tradable from a single cross-margined account. It offers off-exchange
  collateral custody (BitGo OES or self-custody), zero-gas settlement, and a private cross-chain
  RFQ swap service (Rho Relay) bridging Ethereum and Canton Network assets. Rho X exposes a REST
  API, a WebSocket streaming API, an npm SDK, and an official Model Context Protocol (MCP) server
  for programmatic trading, market data, and account management. Backed by Speedinvest.
