openapi: 3.2.0
info:
  description: ''
  title: Rho Exchange Market Data API
  contact: {}
  version: development
servers:
- url: /api/v1
tags:
- name: Market Data
paths:
  /exchange/info:
    get:
      description: Returns list of all symbols, currencies, and relevant metadata.
      tags:
      - Market Data
      summary: Retrieve exchange info
      parameters:
      - description: Include matured symbols
        name: includeMaturedSymbols
        in: query
        schema:
          type: boolean
      - description: Include markets list
        name: includeMarkets
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.ExchangeInfoResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.ExternalError'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.ExternalError'
      operationId: getExchangeInfo
      x-operation-id-source: derived
  /markets/{marketId}/floating-rate-candles:
    get:
      description: Returns floating rate candles for a given market
      tags:
      - Market Data
      summary: Retrieve floating rate candles
      parameters:
      - description: Market ID
        name: marketId
        in: path
        required: true
        schema:
          type: string
      - description: Candle interval
        name: interval
        in: query
        required: true
        schema:
          type: string
          enum:
          - 1m
          - 5m
          - 15m
          - 30m
          - 1h
          - 4h
          - 1d
      - description: Start time (ISO8601 / RFC3339)
        name: startTime
        in: query
        schema:
          type: string
      - description: End time (ISO8601 / RFC3339)
        name: endTime
        in: query
        schema:
          type: string
      - description: Number of candles to retrieve (default=1000)
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.FloatingRateCandlesResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.ExternalError'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.ExternalError'
      operationId: getMarketsByMarketIdFloatingRateCandles
      x-operation-id-source: derived
  /symbols/{symbol}/candles:
    get:
      description: Returns OHLCV (candles) for a symbol over a timeframe
      tags:
      - Market Data
      summary: Retrieve candle data for a symbol
      parameters:
      - description: Symbol
        name: symbol
        in: path
        required: true
        schema:
          type: string
      - description: Candle interval
        name: interval
        in: query
        required: true
        schema:
          type: string
          enum:
          - 1m
          - 5m
          - 15m
          - 30m
          - 1h
          - 4h
          - 1d
      - description: Start time (ISO8601 / RFC3339)
        name: startTime
        in: query
        schema:
          type: string
      - description: End time (ISO8601 / RFC3339)
        name: endTime
        in: query
        schema:
          type: string
      - description: Number of candles to retrieve (default=1000)
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.SymbolCandlesResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.ExternalError'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.ExternalError'
      operationId: getSymbolsBySymbolCandles
      x-operation-id-source: derived
  /symbols/{symbol}/order-book:
    get:
      description: Returns current order book bids and asks, up to a given depth
      tags:
      - Market Data
      summary: Retrieve order book for a symbol
      parameters:
      - description: Symbol
        name: symbol
        in: path
        required: true
        schema:
          type: string
      - description: Depth of order book
        name: depth
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.OrderBookResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.ExternalError'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.ExternalError'
      operationId: getSymbolsBySymbolOrderBook
      x-operation-id-source: derived
  /symbols/{symbol}/trades:
    get:
      description: Returns last N trades for a symbol
      tags:
      - Market Data
      summary: Retrieve recent trades for a symbol
      parameters:
      - description: Symbol
        name: symbol
        in: path
        required: true
        schema:
          type: string
      - description: Number of trades to retrieve (default 100, max 1000)
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.SymbolTradesResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.ExternalError'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.ExternalError'
      operationId: getSymbolsBySymbolTrades
      x-operation-id-source: derived
  /tickers:
    get:
      description: Returns tickers for all symbols or a list of requested symbols.
      tags:
      - Market Data
      summary: Retrieve multiple tickers
      parameters:
      - description: List of symbol strings
        name: symbols
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.TickersResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.ExternalError'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.ExternalError'
      operationId: getTickers
      x-operation-id-source: derived
  /tickers/{symbol}:
    get:
      description: Returns ticker data (high, low, last, open interest, etc.) for a single symbol
      tags:
      - Market Data
      summary: Retrieve ticker for a specific symbol
      parameters:
      - description: Symbol to fetch ticker for
        name: symbol
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.TickerResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.ExternalError'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.ExternalError'
      operationId: getTickersBySymbol
      x-operation-id-source: derived
components:
  schemas:
    dto.SymbolTrade:
      type: object
      properties:
        cmdSeqId:
          type: string
          example: '0'
        floatIndex:
          type: string
        openInterest:
          type: string
        prevAccumulatedVolume:
          type: string
        prevOpenInterest:
          type: string
        price:
          type: string
        side:
          type: string
          enum:
          - sell
          - buy
        symbol:
          type: string
        symbolTradeSeqId:
          type: string
          example: '0'
        time:
          type: string
        tradeType:
          type: string
          enum:
          - regular
          - liquidation
          - self-trade
        volume:
          type: string
    dto.CurrencyConversionEntry:
      type: object
      properties:
        sourceCurrency:
          type: string
        value:
          $ref: '#/components/schemas/dto.MutableDecimalInfo'
    dto.FeatureInfo:
      type: object
      properties:
        featureId:
          type: integer
        seqId:
          type: string
          example: '0'
    dto.DepositaryInfo:
      type: object
      properties:
        blockchainId:
          type: string
        depositaryId:
          type: string
        depositaryType:
          type: string
          enum:
          - blockchain
    dto.MarginAccountInfo:
      type: object
      properties:
        baseCurrency:
          type: string
        marginAccount:
          type: string
        supportedCurrencies:
          type: array
          items:
            type: string
    dto.TickersResponse:
      type: object
      properties:
        tickers:
          type: array
          items:
            $ref: '#/components/schemas/dto.Ticker'
    dto.OrderBookEntry:
      type: object
      properties:
        price:
          type: string
        quantity:
          type: string
    dto.SymbolTradesResponse:
      type: object
      properties:
        trades:
          type: array
          items:
            $ref: '#/components/schemas/dto.SymbolTrade'
    dto.MutableDecimalInfo:
      type: object
      properties:
        updatedAt:
          type: string
        value:
          type: string
    dto.Candle:
      type: object
      properties:
        accumulatedTradesCountAtOpen:
          type: string
          example: '0'
        accumulatedVolumeAtClose:
          type: string
        accumulatedVolumeAtOpen:
          type: string
        closePrice:
          type: string
        closeTime:
          type: string
        highPrice:
          type: string
        interval:
          type: string
        lowPrice:
          type: string
        openInterestAtClose:
          type: string
        openInterestAtOpen:
          type: string
        openPrice:
          type: string
        openTime:
          type: string
        seqId:
          type: string
          example: '0'
        symbol:
          type: string
        tradesCount:
          type: string
          example: '0'
        volume:
          type: string
    dto.FloatingRateCandle:
      type: object
      properties:
        closePrice:
          type: string
        closeTime:
          type: string
        highPrice:
          type: string
        interval:
          type: string
        lowPrice:
          type: string
        marketId:
          type: string
        openPrice:
          type: string
        openTime:
          type: string
        seqId:
          type: string
          example: '0'
    dto.FloatingRateCandlesResponse:
      type: object
      properties:
        candles:
          type: array
          items:
            $ref: '#/components/schemas/dto.FloatingRateCandle'
    dto.Ticker:
      type: object
      properties:
        askPrice:
          type: string
        askSize:
          type: string
        bidPrice:
          type: string
        bidSize:
          type: string
        highPrice:
          type: string
        lastAccumulatedTradesCount:
          type: string
          example: '0'
        lastAccumulatedVolume:
          type: string
        lastOpenInterest:
          type: string
        lastPrice:
          type: string
        lowPrice:
          type: string
        markPrice:
          type: string
        openInterestChange:
          type: string
        priceChange:
          type: string
        seqId:
          type: string
          example: '0'
        symbol:
          type: string
        tradesCountChange:
          type: string
          example: '0'
        volumeChange:
          type: string
    dto.ExchangeInfoResponse:
      type: object
      properties:
        activatedFeatures:
          type: array
          items:
            $ref: '#/components/schemas/dto.FeatureInfo'
        currencies:
          type: array
          items:
            $ref: '#/components/schemas/dto.CurrencyInfo'
        currencyHaircuts:
          type: array
          items:
            $ref: '#/components/schemas/dto.CurrencyConversionInfo'
        currencyRates:
          type: array
          items:
            $ref: '#/components/schemas/dto.CurrencyConversionInfo'
        currencyRiskFactors:
          type: array
          items:
            $ref: '#/components/schemas/dto.CurrencyConversionInfo'
        depositaries:
          type: array
          items:
            $ref: '#/components/schemas/dto.DepositaryInfo'
        marginAccounts:
          type: array
          items:
            $ref: '#/components/schemas/dto.MarginAccountInfo'
        markets:
          type: array
          items:
            $ref: '#/components/schemas/dto.MarketInfo'
        seqId:
          type: string
          example: '0'
        symbols:
          type: array
          items:
            $ref: '#/components/schemas/dto.SymbolInfo'
        withdrawalFees:
          type: array
          items:
            $ref: '#/components/schemas/dto.CurrencyFeeInfo'
    dto.SymbolInfo:
      type: object
      properties:
        baseCurrency:
          type: string
        floatIndex:
          type: string
        floatIndexTimestamp:
          type: string
        floatingRate:
          type: string
        floatingRateTimestamp:
          type: string
        initialMarginThresholdDelta:
          type: string
        isExpired:
          type: boolean
        isFinalized:
          type: boolean
        isLockedUp:
          type: boolean
        issueDate:
          type: string
        maintenanceMarginThresholdDelta:
          type: string
        makerFeeFactor:
          type: string
        marginAccount:
          type: string
        marginMarketHedgeFactor:
          type: string
        marginRequirementMinTimeFactor:
          type: string
        market:
          type: string
        maturityDate:
          type: string
        maturityLockUpWindow:
          type: string
        maxPriceImpactPerTrade:
          type: string
        maxTradeNotional:
          type: string
        minMakerFee:
          type: string
        minTakerFee:
          type: string
        minTradeNotional:
          type: string
        novationLiquidationFeesFactor:
          type: string
        openInterestLimit:
          type: string
        orderPriceCollar:
          type: string
        pausedLiquidations:
          type: boolean
        pausedOrders:
          type: boolean
        priceTickSize:
          type: string
        productType:
          type: string
        rateMathType:
          type: string
        settlementCurrency:
          type: string
        symbol:
          type: string
        takerFeeFactor:
          type: string
        underlyingAsset:
          type: string
        unwindingLiquidationFeesFactor:
          type: string
    dto.SymbolCandlesResponse:
      type: object
      properties:
        candles:
          type: array
          items:
            $ref: '#/components/schemas/dto.Candle'
    dto.CurrencyConversionInfo:
      type: object
      properties:
        sourceCurrencyToValues:
          type: array
          items:
            $ref: '#/components/schemas/dto.CurrencyConversionEntry'
        targetCurrency:
          type: string
    dto.CurrencyFeeInfo:
      type: object
      properties:
        currencyId:
          type: string
        fee:
          $ref: '#/components/schemas/dto.MutableDecimalInfo'
    dto.ExternalError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        params:
          description: Params carries stable flat string metadata for selected V2 AppErrors only.
          type: object
          additionalProperties:
            type: string
        requestId:
          type: string
        seqId:
          type: string
          example: '0'
    dto.CurrencyInfo:
      type: object
      properties:
        blockchainAddress:
          type: string
        blockchainId:
          type: string
        id:
          type: string
        scale:
          type: string
          example: '0'
    dto.TickerResponse:
      type: object
      properties:
        ticker:
          $ref: '#/components/schemas/dto.Ticker'
    dto.MarketInfo:
      type: object
      properties:
        baseCurrency:
          type: string
        floatingRate:
          type: string
        floatingRateTimestamp:
          type: string
        id:
          type: string
        initialMarginThresholdDelta:
          type: string
        maintenanceMarginThresholdDelta:
          type: string
        makerFeeFactor:
          type: string
        marginAccount:
          type: string
        marginMarketHedgeFactor:
          type: string
        marginRequirementMinTimeFactor:
          type: string
        maturityLockUpWindow:
          type: string
        maxPriceImpactPerTrade:
          type: string
        maxTradeNotional:
          type: string
        minFeeTimeFloor:
          type: string
        minMakerFee:
          type: string
        minTakerFee:
          type: string
        minTradeNotional:
          type: string
        novationLiquidationFeesFactor:
          type: string
        orderPriceCollar:
          type: string
        priceTickSize:
          type: string
        productType:
          type: string
        rateMathType:
          type: string
        takerFeeFactor:
          type: string
        underlyingAsset:
          type: string
        unwindingLiquidationFeesFactor:
          type: string
    dto.OrderBookResponse:
      type: object
      properties:
        asks:
          type: array
          items:
            $ref: '#/components/schemas/dto.OrderBookEntry'
        bids:
          type: array
          items:
            $ref: '#/components/schemas/dto.OrderBookEntry'
        seqId:
          type: string
          example: '0'
        symbol:
          type: string
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
