openapi: 3.2.0
info:
  description: ''
  title: Rho Exchange Stats API
  contact: {}
  version: development
servers:
- url: /api/v1
tags:
- name: Stats
paths:
  /stats/volume:
    get:
      description: Returns volume stats for a given timeframe
      tags:
      - Stats
      summary: Retrieve volume stats
      parameters:
      - description: Start time (ISO8601 / RFC3339)
        name: startTime
        in: query
        required: true
        schema:
          type: string
      - description: End time (ISO8601 / RFC3339)
        name: endTime
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.ExternalError'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.ExternalError'
      operationId: getStatsVolume
      x-operation-id-source: derived
components:
  schemas:
    dto.ExternalError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        params:
          description: Params carries stable flat string metadata for selected V2 AppErrors only.
          type: object
          additionalProperties:
            type: string
        requestId:
          type: string
        seqId:
          type: string
          example: '0'
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
